# rdpfree-workflow-schema: 3
# XyVerse wallpaper is automatic, using the original repository asset.
name: RdpFree — 6-Hour RDP
'on':
  workflow_dispatch:
    inputs:
      durasi_menit:
        description: Session duration in minutes. Exactly 6 hours = 360
        required: false
        default: '360'
        type: choice
        options:
        - '15'
        - '30'
        - '60'
        - '120'
        - '180'
        - '240'
        - '300'
        - '330'
        - '360'
      hostname:
        description: 'Session hostname (a run number may be added, e.g. xyrdp-42)'
        required: false
        default: rdpfree
        type: string
      rdp_user:
        description: RDP login username (3–20 letters, numbers, _, or -)
        required: false
        default: xyadmin
        type: string
      akses:
        description: Private Tailscale access. Your phone/PC must be on the same tailnet.
        required: false
        default: tailscale
        type: choice
        options:
        - tailscale
      debloat:
        description: 'Debloat: remove Microsoft Edge and Mozilla Firefox only'
        required: false
        default: 'yes'
        type: choice
        options:
        - 'yes'
        - 'no'
      win11:
        description: Windows 11 appearance (hosted windows-2025 target; use self-hosted for a pinned Windows 11 machine)
        required: false
        default: 'yes'
        type: choice
        options:
        - 'yes'
        - 'no'
      xydesk:
        description: Host setup XyDesk Remote (AVC444 + ClearType + multi-session + audio/mic + UDP 4433)
        required: false
        default: 'yes'
        type: choice
        options:
        - 'yes'
        - 'no'
      ekstra:
        description: 'Automatic extras: wallpaper + translucent taskbar + Codex CLI with Desktop shortcut'
        required: false
        default: 'yes'
        type: choice
        options:
        - 'yes'
        - 'no'
      runner:
        description: GitHub uses windows-2025 as the Windows 11-based hosted target; choose self-hosted with the windows-11 label for a pinned Windows 11 OS
        required: false
        default: github
        type: choice
        options:
        - github
        - self-hosted
      microphone:
        description: Allow microphone input through RDP (the Android client must still grant permission)
        required: false
        default: 'yes'
        type: choice
        options:
        - 'yes'
        - 'no'
permissions:
  contents: write
  actions: read
concurrency:
  group: xyrdp
  cancel-in-progress: false
jobs:
  rdp:
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","Windows","X64","rdpfree","windows-11"]') || 'windows-2025'
      }}
    timeout-minutes: 360
    env:
      DUR: ${{ inputs.durasi_menit }}
      HOSTNAME: ${{ inputs.hostname }}
      AKSES: tailscale
      WIN11: ${{ inputs.win11 }}
      XYDESK: ${{ inputs.xydesk }}
      EXTRAS: ${{ inputs.ekstra }}
      WALLPAPER_URL: ''
      RDP_USER: ${{ inputs.rdp_user || 'xyadmin' }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      CLEANUP_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
      KEEP_RUNS: '3'
      GITHUB_TOKEN: ${{ github.token }}
      DEBLOAT: ${{ inputs.debloat }}
      RDPFREE_RUNNER: ${{ inputs.runner }}
      MICROPHONE: ${{ inputs.microphone }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Environment info (OS, version, and initial disk space)
      timeout-minutes: 5
      shell: pwsh
      run: '$os = Get-CimInstance Win32_OperatingSystem

        Write-Host "[RdpFree] OS runner : $($os.Caption) build $($os.Version)"

        Write-Host "[RdpFree] Initial disk space:"

        Get-CimInstance Win32_LogicalDisk | ForEach-Object { Write-Host "  $($_.DeviceID) $([math]::Round($_.Size/1GB,1))GB
        total / $([math]::Round($_.FreeSpace/1GB,1))GB free" }

        Write-Host "[RdpFree] Note: debloat=$env:DEBLOAT"

        '
    - name: Basic setup (admin user + RDP 3389)
      timeout-minutes: 15
      shell: pwsh
      run: ./scripts/setup-rdp.ps1
    - name: Remove Microsoft Edge and Mozilla Firefox only
      if: ${{ inputs.debloat != 'no' }}
      timeout-minutes: 10
      continue-on-error: true
      shell: pwsh
      run: ./scripts/setup-debloat.ps1
    - name: Windows 11 appearance (personalization and wallpaper)
      if: ${{ inputs.win11 != 'no' }}
      timeout-minutes: 15
      shell: pwsh
      run: ./scripts/setup-win11.ps1
    - name: XyDesk Remote host setup (AVC444 + ClearType + audio/microphone + UDP 4433)
      if: ${{ inputs.xydesk != 'no' }}
      timeout-minutes: 10
      shell: pwsh
      run: ./scripts/setup-xydesk.ps1
    - name: Appearance, wallpaper, and optional coding editors
      if: ${{ inputs.ekstra != 'no' }}
      timeout-minutes: 20
      continue-on-error: true
      shell: pwsh
      run: ./scripts/setup-extras.ps1
    - name: Private Tailscale access
      timeout-minutes: 15
      shell: pwsh
      run: ./scripts/setup-akses.ps1
    - name: User-session wallpaper and microphone
      shell: pwsh
      timeout-minutes: 5
      run: ./scripts/setup-media.ps1
    - name: Connection summary without secret credentials
      shell: pwsh
      run: '$st = Get-Content out/rdp-status.json -Raw | ConvertFrom-Json

        Write-Host "Tailscale: $($st.akses.tailscale.ip):3389"

        Write-Host "Username: $env:RDP_USER"

        Write-Host ''The password is not printed to logs. Use a password manager or the dashboard vault.''

        Write-Host "Microphone: $($st.media.microphone) | Wallpaper: $($st.media.wallpaper)"'
    - name: Publish status to the status branch
      continue-on-error: true
      timeout-minutes: 10
      shell: pwsh
      run: ./scripts/publish-status.ps1 -Active $true
    - name: Final system summary
      timeout-minutes: 5
      continue-on-error: true
      shell: pwsh
      run: |
        Write-Host "=== FINAL SYSTEM SUMMARY ==="
        Get-CimInstance Win32_LogicalDisk | ForEach-Object { Write-Host "  $($_.DeviceID) $([math]::Round($_.Size/1GB,1))GB total / $([math]::Round($_.FreeSpace/1GB,1))GB free" }
        $st = Get-Content out/rdp-status.json -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
        if ($st.akses.tailscale.ip) { Write-Host "Tailscale: $($st.akses.tailscale.ip)" }
    - name: Keep the session alive until its duration ends
      shell: pwsh
      run: ./scripts/keepalive.ps1
    - name: Finalize (disable access, clear status, remove old runs)
      if: always()
      continue-on-error: true
      timeout-minutes: 15
      shell: pwsh
      run: './scripts/publish-status.ps1 -Active $false

        ./scripts/finalize-rdp.ps1

        ./scripts/cleanup-actions.ps1

        '
